{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - aBCG Monitoring Application</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            border: 'var(--border)',
            input: 'var(--input)',
            ring: 'var(--ring)',
            background: 'var(--background)',
            foreground: 'var(--foreground)',
            primary: {
              DEFAULT: 'var(--primary)',
              foreground: 'var(--primary-foreground)',
            },
            secondary: {
              DEFAULT: 'var(--secondary)',
              foreground: 'var(--secondary-foreground)',
            },
            destructive: {
              DEFAULT: 'var(--destructive)',
              foreground: 'var(--destructive-foreground)',
            },
            muted: {
              DEFAULT: 'var(--muted)',
              foreground: 'var(--muted-foreground)',
            },
            popover: {
              DEFAULT: 'var(--popover)',
              foreground: 'var(--popover-foreground)',
            },
            card: {
              DEFAULT: 'var(--card)',
              foreground: 'var(--card-foreground)',
            },
          },
          borderRadius: {
            lg: 'var(--radius)',
            md: 'calc(var(--radius) - 2px)',
            sm: 'calc(var(--radius) - 4px)',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-background text-foreground transition-colors duration-200">
  <main class="grid min-h-dvh grid-cols-1 bg-background lg:grid-cols-2 animate-fade-in">
    <!-- Brand panel (Left Side) - Vaccine Image Background -->
    <section 
      class="relative hidden bg-cover bg-center lg:flex overflow-hidden"
      style="background-image: url('{% static 'vaccine_background.png' %}');"
    >
      <div class="absolute inset-0 bg-gradient-to-tr from-slate-950/40 via-transparent to-slate-950/10 pointer-events-none"></div>
    </section>

    <!-- Form panel (Right Side) -->
    <section class="flex items-center justify-center p-6 md:p-10">
      <div class="w-full max-w-sm space-y-8">
        <div class="space-y-1.5">
          <p class="text-[13px] font-bold uppercase tracking-wider text-primary">
            Welcome to aBCG Monitoring Application
          </p>
          <h2 class="text-3xl font-extrabold tracking-tight text-foreground">
            Login
          </h2>
        </div>

        {% if error %}
          <div class="flex items-start gap-2.5 rounded-xl bg-destructive/10 border border-destructive/20 p-3.5 text-xs text-destructive animate-shake">
            <i data-lucide="alert-circle" class="size-4 shrink-0 mt-0.5"></i>
            <span class="font-medium leading-relaxed">{{ error }}</span>
          </div>
        {% endif %}

        <form class="space-y-5" method="POST" action="{% url 'questions:home' %}">
          {% csrf_token %}
          <div class="space-y-2">
            <label class="text-sm font-semibold tracking-wide text-muted-foreground uppercase text-[10px]">
              User ID
            </label>
            <input
              type="text"
              name="user_id"
              required
              placeholder="Enter your user ID"
              autocomplete="username"
              class="flex h-10 w-full rounded-lg border border-border bg-background px-3.5 py-1 text-sm shadow-sm transition-colors placeholder:text-muted-foreground focus-visible:border-ring focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/25"
            >
          </div>

          <div class="space-y-2">
            <label class="text-sm font-semibold tracking-wide text-muted-foreground uppercase text-[10px]">
              Password
            </label>
            <input
              type="password"
              name="password"
              required
              placeholder="Enter your password"
              autocomplete="current-password"
              class="flex h-10 w-full rounded-lg border border-border bg-background px-3.5 py-1 text-sm shadow-sm transition-colors placeholder:text-muted-foreground focus-visible:border-ring focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/25"
            >
          </div>

          <div class="space-y-3">
            <label class="text-sm font-semibold tracking-wide text-muted-foreground uppercase text-[10px]">
              Security Verification
            </label>
            <div class="flex flex-col gap-2.5">
              <div class="flex items-center gap-2">
                <!-- Visual CAPTCHA display -->
                <div
                  id="captcha-box"
                  class="relative flex items-center justify-center font-mono text-xl font-bold tracking-[0.3em] text-foreground bg-muted/60 border border-border rounded-lg select-none px-4 py-2 h-10 w-32 overflow-hidden shadow-inner"
                  style="background-image: radial-gradient(circle, var(--border) 1px, transparent 1px); background-size: 8px 8px;"
                >
                  <span id="captcha-text" class="relative z-10 transform -rotate-3 scale-110 blur-[0.2px] text-primary italic">
                    XXXXX
                  </span>
                  <!-- Decorative strike lines -->
                  <div class="absolute inset-x-0 border-t border-destructive/20 top-1/3 transform rotate-6 pointer-events-none"></div>
                  <div class="absolute inset-x-0 border-t border-primary/20 top-2/3 transform -rotate-6 pointer-events-none"></div>
                </div>
                
                <input type="hidden" name="captcha_code" id="captcha-code-hidden">

                <button
                  type="button"
                  onclick="generateCaptcha()"
                  class="inline-flex items-center justify-center rounded-lg border border-border bg-background shadow-sm hover:bg-muted text-foreground transition-all size-10 cursor-pointer active:scale-95"
                  aria-label="Refresh Captcha"
                >
                  <i data-lucide="rotate-cw" id="refresh-icon" class="size-4 text-muted-foreground hover:text-foreground transition-transform duration-300"></i>
                </button>
              </div>
              <input
                type="text"
                name="captcha_input"
                required
                placeholder="Enter the code shown above"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                class="flex h-10 w-full rounded-lg border border-border bg-background px-3.5 py-1 text-sm shadow-sm transition-colors placeholder:text-muted-foreground focus-visible:border-ring focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/25 font-mono tracking-wider"
              >
            </div>
          </div>

          <button
            type="submit"
            class="w-full h-11 text-sm font-semibold rounded-lg bg-primary text-primary-foreground hover:bg-primary/95 hover:shadow-lg transition-all duration-200 cursor-pointer mt-2 inline-flex items-center justify-center gap-2"
          >
            <i data-lucide="key-round" class="size-4"></i> Login
          </button>
        </form>
      </div>
    </section>
  </main>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Captcha Generation
    function generateCaptcha() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 5; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById('captcha-text').innerText = code;
      document.getElementById('captcha-code-hidden').value = code;

      // Add simple spin effect to refresh icon
      const icon = document.getElementById('refresh-icon');
      icon.classList.add('rotate-180');
      setTimeout(() => icon.classList.remove('rotate-180'), 300);
    }

    // Generate on page load
    window.onload = generateCaptcha;
  </script>
</body>
</html>
